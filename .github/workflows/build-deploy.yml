name: Deploy UI to GitHub Pages

on:
  push:
    branches: [ddib25-deployment]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
 
# Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Clean yarn cache
        run: yarn cache clean
        
      - name: Clean node_modules
        run: |
          rm -rf node_modules
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Load environment variables from .env
        run: |
          if [ -f .env ]; then
            echo "Loading environment variables from .env file"
            cat .env | grep -v '^#' | grep -v '^$' | while IFS= read -r line; do
              echo "$line" >> $GITHUB_ENV
            done
          else
            echo "No .env file found"
          fi

      # .github/workflows/build-deploy.yml (just the build step)
      - name: Build Next.js app
        run: NEXT_TELEMETRY_DISABLED=1 yarn build
        env:
          NODE_ENV: production  # Changed from development
          SEQUENCER_API_URL: ${{ secrets.SEQUENCER_API_URL }}
          CENSUS_API_URL: ${{ secrets.CENSUS_API_URL }}
          RPC_URL: ${{ secrets.RPC_URL }}
          ESLINT_NO_DEV_ERRORS: true
          NEXT_SKIP_TYPE_CHECK: 1  # Move this to env instead of in command

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out  # Next.js static export path

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
